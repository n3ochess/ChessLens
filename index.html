<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#262421">
<meta name="description" content="ChessLens — analyze chess games offline with Stockfish, right in your browser.">
<title>ChessLens</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23262421'/%3E%3Ccircle cx='28' cy='28' r='15' fill='none' stroke='%2381b64c' stroke-width='6'/%3E%3Cpath d='M39 39l14 14' stroke='%2381b64c' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><circle cx="28" cy="28" r="15" fill="none" stroke="#81b64c" stroke-width="6"/><path d="M39 39l14 14" stroke="#81b64c" stroke-width="7" stroke-linecap="round"/></svg>
      <span>ChessLens</span>
      <span id="net" class="net" hidden>Offline</span>
    </div>
    <div class="spacer"></div>
    <button id="btn-install" class="btn ghost" hidden>Install</button>
    <button id="btn-flip" class="icon-btn" aria-label="Flip board" title="Flip board">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
    </button>
    <button id="btn-import" class="btn primary">Import</button>
  </header>

  <div id="status" class="status" hidden>
    <div class="status-row"><span id="status-text"></span><span id="status-pct"></span></div>
    <div id="status-track" class="bar"><i id="status-bar"></i></div>
  </div>

  <main id="main">
    <div class="board-col">
      <div class="player" id="player-top"></div>

      <div class="board-wrap">
        <div class="evalbar wb" id="evalbar" aria-label="Evaluation bar">
          <div class="eval-white" id="eval-white"></div>
          <span class="eval-label lb" id="eval-label">0.0</span>
        </div>
        <div class="board-box" id="board-box">
          <div class="board" id="board"></div>
          <svg id="overlay" viewBox="0 0 8 8" aria-hidden="true"></svg>
        </div>
      </div>

      <div class="player" id="player-bottom"></div>
    </div>

    <div class="side-col">
      <section class="card" id="card" aria-live="polite"></section>

      <nav class="moves" id="moves" aria-label="Move list"></nav>

      <footer class="foot">
        <p>Independent tool — not affiliated with Chess.com</p>
        <p class="tiny">Analysis runs on your device · Stockfish + chess.js</p>
      </footer>
    </div>
  </main>

  <div class="controls" role="toolbar" aria-label="Playback">
    <button id="btn-first" aria-label="First move">|&lt;</button>
    <button id="btn-prev" aria-label="Previous move">&lt;</button>
    <button id="btn-next" aria-label="Next move">&gt;</button>
    <button id="btn-last" aria-label="Last move">&gt;|</button>
  </div>
</div>

<!-- Import drawer -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Import game">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>Import game</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="user" aria-selected="true">Chess.com</button>
      <button class="tab" role="tab" data-tab="pgn" aria-selected="false">Paste PGN</button>
    </div>

    <section id="tab-user" class="tabpane">
      <label class="lbl" for="in-user">Chess.com username</label>
      <div class="row">
        <input id="in-user" type="text" inputmode="text" autocapitalize="none" autocomplete="username" autocorrect="off" spellcheck="false" placeholder="e.g. hikaru">
      </div>
      <button id="btn-load-games" class="btn primary wide">Load Recent Games</button>
      <p id="user-msg" class="msg" role="status"></p>
      <div id="glist" class="glist"></div>
    </section>

    <section id="tab-pgn" class="tabpane" hidden>
      <label class="lbl" for="in-pgn">PGN</label>
      <textarea id="in-pgn" rows="9" spellcheck="false" autocapitalize="none" autocorrect="off" placeholder="Paste PGN here…"></textarea>
      <div class="row gap">
        <button id="btn-load-pgn" class="btn primary grow">Analyze PGN</button>
        <button id="btn-sample" class="btn ghost grow">Load Sample Game</button>
      </div>
      <p id="pgn-msg" class="msg" role="status"></p>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js';document.head.appendChild(s);"></script>
<script src="app.js" defer></script>
</body>
</html>
